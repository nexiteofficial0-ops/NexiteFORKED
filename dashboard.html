<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard | Nexite</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="auth.css"><link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet"></head><body class="auth-page"><main class="auth-shell"><nav class="auth-nav"><a href="/">NEXITE</a><a href="user.html">account</a></nav><section class="profile-head"><img id="avatar" class="profile-avatar" src="/stuff/icons/user.png" alt="profile picture"><div><h1 id="profile-name">profile</h1><p id="profile-bio">no bio yet.</p></div></section><p id="profile-link"></p><section id="editor" class="profile-grid"><label class="auth-form">bio<textarea id="bio" maxlength="240"></textarea></label><label class="auth-form">custom profile picture<input id="avatar-file" type="file" accept="image/*"></label><label class="auth-form profile-wide">saved game data<textarea id="game-data" placeholder="Game data saved in this browser"></textarea></label><div class="auth-form profile-wide"><button id="save-profile" class="auth-button" type="button">save profile and game data</button><button id="erase-data" class="auth-button danger" type="button">erase game data</button><button id="logout" class="auth-button" type="button">log out</button><p id="status" class="auth-success" role="status"></p></div></section></main><script src="auth.js"></script><script>const params=new URLSearchParams(location.search);const session=NexiteAuth.currentUser();const viewed=params.get('user')||session;const user=NexiteAuth.getUser(viewed);const editor=document.getElementById('editor');const status=document.getElementById('status');if(!user){document.getElementById('profile-name').textContent='profile not found';editor.hidden=true}else{document.title=user.username+' | Nexite';document.getElementById('profile-name').textContent='@'+user.username;document.getElementById('profile-bio').textContent=user.bio||'no bio yet.';if(user.avatar)document.getElementById('avatar').src=user.avatar;document.getElementById('profile-link').innerHTML='<a class="auth-link" href="'+location.href+'">share this profile</a>';if(viewed!==session){editor.hidden=true}else{document.getElementById('bio').value=user.bio;document.getElementById('game-data').value=user.gameData}}document.getElementById('save-profile').addEventListener('click',()=>{const all=NexiteAuth.users();const current=all[session];current.bio=document.getElementById('bio').value;current.gameData=document.getElementById('game-data').value;NexiteAuth.fileToDataUrl(document.getElementById('avatar-file').files[0],data=>{if(data)current.avatar=data;NexiteAuth.write('nexite-users',all);location.reload()})||(()=>{NexiteAuth.write('nexite-users',all);location.reload()})();});document.getElementById('erase-data').addEventListener('click',()=>{const all=NexiteAuth.users();all[session].gameData='';NexiteAuth.write('nexite-users',all);document.getElementById('game-data').value='';status.textContent='Game data erased.'});document.getElementById('logout').addEventListener('click',()=>{localStorage.removeItem('nexite-session');location.href='user.html'});</script></body></html>
