<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="/game-overlay.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Martin County School District | Video Player</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --background: #270f0f;
            --dark: #180909;
            --red: #ff4545;
            --red-dark: #83261f;
            --red-border: #be3b32;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        body {
            background:
                radial-gradient(
                    circle at 50% 45%,
                    rgba(190, 59, 50, 0.12),
                    transparent 35%
                ),
                #270f0f;

            color: white;
            font-family: "Quicksand", Helvetica, Arial, sans-serif;
            overflow: hidden;
        }

        button,
        img {
            cursor: pointer;
        }

        #player {
            position: fixed;
            inset: 0;

            display: flex;
            gap: 12px;

            padding: 12px;
        }

        #game-area {
            position: relative;

            flex: 1;
            min-width: 0;

            background: #120707;

            border: 3px solid #251515;
            border-radius: 20px;

            overflow: hidden;

            box-shadow:
                0 10px 35px rgba(0, 0, 0, 0.35);
        }

        #game-frame {
            width: 100%;
            height: 100%;

            border: 0;
            display: block;

            background: #000;
        }

        #sidebar {
            width: 190px;
            flex-shrink: 0;

            display: flex;
            flex-direction: column;
            gap: 10px;

            padding: 12px;

            background: rgba(29, 9, 9, 0.9);

            border: 3px solid #251515;
            border-radius: 20px;

            backdrop-filter: blur(8px);

            box-shadow:
                0 10px 35px rgba(0, 0, 0, 0.3);
        }

        #game-picture {
            width: 100%;
            aspect-ratio: 1 / 1;

            object-fit: cover;

            border-radius: 15px;
            border: 3px solid #251515;

            background: #180909;

            transition: 0.2s ease;
        }

        #game-picture:hover {
            border-color: #be3b32;

            box-shadow:
                0 0 12px rgba(190, 59, 50, 0.4);
        }

        #game-title {
            margin: 4px 0 5px;

            font-size: 18px;
            font-weight: 700;

            text-align: center;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        #game-subtitle {
            margin: 0 0 8px;

            color: #777;
            font-size: 11px;

            text-align: center;
        }

        .player-button {
            width: 100%;
            min-height: 45px;

            padding: 10px 12px;

            border: 3px solid #251515;
            border-radius: 13px;

            background: #180909;
            color: white;

            font-family: "Quicksand", sans-serif;
            font-size: 13px;
            font-weight: 600;

            transition: 0.2s ease;
        }

        .player-button:hover {
            background: #83261f;

            border-color: #be3b32;

            box-shadow:
                0 0 10px rgba(190, 59, 50, 0.5),
                0 0 20px rgba(190, 59, 50, 0.25);

            transform: translateY(-1px);
        }

        .player-button:active {
            transform: scale(0.98);
        }

        #back-button {
            color: #aaa;
        }

        #back-button:hover {
            color: white;
        }

        #game-area:fullscreen {
            width: 100vw;
            height: 100vh;

            border: 0;
            border-radius: 0;
        }

        @media (max-width: 700px) {
            #player {
                flex-direction: column;
                padding: 8px;
                gap: 8px;
            }

            #game-area {
                height: calc(100% - 145px);
                min-height: 0;
            }

            #sidebar {
                width: 100%;
                height: 125px;

                flex-direction: row;
                align-items: center;

                padding: 8px;
            }

            #game-picture {
                width: 90px;
                height: 90px;
                flex-shrink: 0;
            }

            .sidebar-info {
                flex: 1;
                min-width: 0;
            }

            #game-title {
                text-align: left;
                margin: 0 0 3px;
            }

            #game-subtitle {
                text-align: left;
                margin: 0;
            }

            .sidebar-buttons {
                width: 125px;

                display: flex;
                flex-direction: column;
                gap: 6px;
            }

            .player-button {
                min-height: 40px;
                padding: 7px;
                font-size: 12px;
            }
        }
    </style>
</head>
