<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Martin County School District | Video Player</title>
      <link rel="icon" href="/stuff/logo.png">


    <link
        href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --background: #270f0f;
            --dark: #180909;
            --red: #ff4545;
            --red-dark: #83261f;
            --red-border: #be3b32;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        body {
            background:
                radial-gradient(
                    circle at 50% 45%,
                    rgba(190, 59, 50, 0.12),
                    transparent 35%
                ),
                #270f0f;

            color: white;
            font-family: "Quicksand", Helvetica, Arial, sans-serif;
            overflow: hidden;
        }

        button,
        img {
            cursor: pointer;
        }

        #player {
            position: fixed;
            inset: 0;

            display: flex;
            gap: 12px;

            padding: 12px;
        }

        #game-area {
            position: relative;

            flex: 1;
            min-width: 0;

            background: #120707;

            border: 3px solid #251515;
            border-radius: 20px;

            overflow: hidden;

            box-shadow:
                0 10px 35px rgba(0, 0, 0, 0.35);
        }

        #game-frame {
            width: 100%;
            height: 100%;

            border: 0;
            display: block;

            background: #000;
        }

        #game-area:fullscreen {
            width: 100vw;
            height: 100vh;

            border: 0;
            border-radius: 0;
        }

        @media (max-width: 700px) {
            #player {
                flex-direction: column;
                padding: 8px;
                gap: 8px;
            }

            #game-area {
                height: calc(100% - 145px);
                min-height: 0;
            }

        }
    </style>
</head>

<body>

<div id="player">

    <div id="game-area">
        <iframe
            id="game-frame"
            src="/stuff/selfhosted/movies/movies.html"
            allowfullscreen
            allow="fullscreen; autoplay; gamepad"
        ></iframe>
</div>

<script>
const gameFrame = document.getElementById("game-frame");

const gameURL = sessionStorage.getItem("gameURL");

if (gameURL) {
    gameFrame.src = gameURL;
} else {
    gameFrame.src = "/stuff/selfhosted/movies/movies.html";
}

function reloadGame() {
    gameFrame.src = gameFrame.src;
}

function fullscreenGame() {
    if (gameFrame.requestFullscreen) {
        gameFrame.requestFullscreen();
    }
}
</script>

</body>
</html>
