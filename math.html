    <script>
        // Game search/filter functionality - FULLY FUNCTIONAL
        document.addEventListener('DOMContentLoaded', function() {
            const searchInput = document.getElementById('teachertouchbar');
            const gameContainer = document.getElementById('mathworksheets');
            const gameImages = gameContainer.querySelectorAll('.gamebtns');
            const resourceCount = document.getElementById('resourcecount');

            function getImageCandidates(img) {
                const currentUrl = new URL(img.src, window.location.href);
                const currentPath = currentUrl.pathname;
                const extensionMatch = currentPath.match(/\.(png|jpg|jpeg)$/i);
                const candidates = [img.src];
                const gameName = img.alt.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
                const folderMatch = img.getAttribute('onclick').match(/selfhosted\/([^/]+)\//);
                const folderName = folderMatch ? folderMatch[1] : '';

                if (extensionMatch) {
                    const alternateExtension = extensionMatch[1].toLowerCase() === 'jpg' ? 'png' : 'jpg';
                    candidates.push(currentPath.replace(/\.(png|jpg|jpeg)$/i, '.' + alternateExtension));
                }

                if (currentUrl.hostname === 'frogiesarcade.win') {
                    if (gameName) {
                        candidates.push(currentUrl.origin + '/stuff/games/' + gameName + '.jpg');
                        candidates.push(currentUrl.origin + '/stuff/games/' + gameName + '.png');
                    }
                    if (folderName) {
                        candidates.push(currentUrl.origin + '/stuff/games/' + folderName + '.jpg');
                        candidates.push(currentUrl.origin + '/stuff/games/' + folderName + '.png');
                    }
                }

                return [...new Set(candidates)];
            }

            gameImages.forEach(function(img) {
                const candidates = getImageCandidates(img);
                let candidateIndex = 0;
                img.dataset.gameName = img.alt;
                img.alt = '';

                function tryNextImage() {
                    candidateIndex++;
                    if (candidateIndex < candidates.length) {
                        img.src = candidates[candidateIndex];
                    } else {
                        img.style.visibility = 'hidden';
                    }
                }

                img.addEventListener('error', tryNextImage);
                img.src = candidates[0];
            });

            // Create a "no results" message
            const noResultsMsg = document.createElement('div');
            noResultsMsg.id = 'no-results-message';
            noResultsMsg.style.cssText = 'text-align:center; padding: 40px; font-size: 18px; color: #999; display: none;';
            noResultsMsg.textContent = 'No games found matching your search';
            gameContainer.parentNode.insertBefore(noResultsMsg, gameContainer.nextSibling);

            // Display initial count
            resourceCount.textContent = gameImages.length + ' games available';

            // Check for search parameter in URL
            const urlParams = new URLSearchParams(window.location.search);
            const searchParam = urlParams.get('search');
            
            if (searchParam) {
                searchInput.value = searchParam;
                // Trigger the search
                performSearch(searchParam);
                // Scroll to results
                gameContainer.scrollIntoView({ behavior: 'smooth' });
            }

            // Search functionality
            searchInput.addEventListener('input', function(e) {
                performSearch(e.target.value);
            });

            function performSearch(searchTerm) {
                searchTerm = searchTerm.toLowerCase().trim();
                let visibleCount = 0;

                gameImages.forEach(function(img) {
                    const alt = img.dataset.gameName.toLowerCase();
                    
                    if (searchTerm === '' || alt.includes(searchTerm)) {
                        img.style.display = 'block';
                        visibleCount++;
                    } else {
                        img.style.display = 'none';
                    }
                });

                // Show/hide no results message
                if (searchTerm && visibleCount === 0) {
                    noResultsMsg.style.display = 'block';
                } else {
                    noResultsMsg.style.display = 'none';
                }

                // Update resource count
                if (searchTerm) {
                    resourceCount.textContent = visibleCount + ' game' + (visibleCount !== 1 ? 's' : '') + ' found';
                } else {
                    resourceCount.textContent = gameImages.length + ' games available';
                }
            }

            // Allow Enter key to work too
            searchInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                }
            });

            // Clear search on Escape key
            searchInput.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') {
                    searchInput.value = '';
                    performSearch('');
                    searchInput.focus();
                }
            });

            // Add focus styling
            searchInput.addEventListener('focus', function() {
                this.style.borderColor = '#be3b32';
                this.style.boxShadow = '0 0 10px rgba(190, 59, 50, 0.3)';
            });

            searchInput.addEventListener('blur', function() {
                this.style.borderColor = '';
                this.style.boxShadow = '';
            });
        });
    </script>
