<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login | Nexite</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="auth.css"><link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet"></head><body class="auth-page"><main class="auth-shell"><nav class="auth-nav"><a href="user.html">account</a><a href="signup.html">sign up</a></nav><h1>login</h1><form id="login-form" class="auth-form"><label>username<input id="username" required autocomplete="username"></label><label>password<input id="password" type="password" required autocomplete="current-password"></label><p id="login-error" class="auth-error" role="alert"></p><button class="auth-button" type="submit">login</button></form><p><a class="auth-link" href="signup.html">create an account</a></p></main><script src="auth.js"></script><script>document.getElementById('login-form').addEventListener('submit',event=>{event.preventDefault();const name=document.getElementById('username').value.trim().toLowerCase();const user=NexiteAuth.getUser(name);const error=document.getElementById('login-error');if(!user||user.password!==document.getElementById('password').value){error.textContent='Username or password is incorrect';return}NexiteAuth.setSession(name);location.href='dashboard.html'});</script></body></html>
