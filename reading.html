	</main>

	<script src="/stuff/js/particles.js"></script>
	<script src="/stuff/js/site-particles.js"></script>
	<script src="loading.js"></script>
	<script src="moresettings.js"></script>
	<script>
		const appSearch = document.getElementById("app-search");
		const appCards = [...document.querySelectorAll(".app-card")];
		const appNoResults = document.getElementById("app-no-results");

		function filterApps() {
			const query = appSearch.value.trim().toLowerCase();
			let visibleApps = 0;

			appCards.forEach(card => {
				const matches = card.querySelector("img").alt.toLowerCase().includes(query);
				card.hidden = !matches;
				if (matches) {
					visibleApps += 1;
				}
			});

			appNoResults.hidden = visibleApps !== 0;
		}

		appSearch.addEventListener("input", filterApps);
		appSearch.addEventListener("keydown", event => {
			if (event.key === "Escape") {
				appSearch.value = "";
				filterApps();
				appSearch.blur();
			}
		});
	</script>

</body>
