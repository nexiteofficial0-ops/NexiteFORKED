<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 | Page Not Found</title>
    <style>
        :root {
            --ink: #edf4ff;
            --muted: #9aabc2;
            --blue: #75b9ff;
            --blue-dark: #3566d6;
            --night: #07111f;
            --panel: #101d31;
        }

        * { box-sizing: border-box; }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            overflow: hidden;
            color: var(--ink);
            background: radial-gradient(circle at 80% 10%, #183c68 0, transparent 34%), var(--night);
            font-family: 'Segoe UI', sans-serif;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            opacity: .18;
            pointer-events: none;
            background-image: linear-gradient(#fff1 1px, transparent 1px), linear-gradient(90deg, #fff1 1px, transparent 1px);
            background-size: 36px 36px;
            mask-image: linear-gradient(to bottom, black, transparent 85%);
        }

        main {
            position: relative;
            width: min(680px, calc(100% - 32px));
            padding: clamp(36px, 8vw, 72px);
            text-align: center;
            background: color-mix(in srgb, var(--panel) 88%, transparent);
            border: 1px solid #75b9ff55;
            border-radius: 28px;
            box-shadow: 0 28px 90px #0008;
        }

        .code {
            margin: 0;
            color: var(--blue);
            font: 800 clamp(72px, 16vw, 132px)/.8 'Segoe UI', sans-serif;
            letter-spacing: .04em;
        }

        h1 { margin: 28px 0 12px; font-size: clamp(25px, 5vw, 38px); }
        p { margin: 0 auto 30px; max-width: 400px; color: var(--muted); font: 16px/1.6 Arial, sans-serif; }

        a {
            display: inline-block;
            padding: 14px 22px;
            color: white;
            background: linear-gradient(135deg, var(--blue), var(--blue-dark));
            border-radius: 12px;
            font: 700 14px Arial, sans-serif;
            text-decoration: none;
            transition: transform .2s, filter .2s;
        }

        a:hover { filter: brightness(1.12); transform: translateY(-2px); }
    </style>
</head>

<body>
    <main>
        <p class="code">404</p>
        <h1>Page not found</h1>
        <p>The address you entered does not lead anywhere. Check the URL or return to the main page.</p>
        <a href="index.html">Return to main page</a>
    </main>
</body>

</html>
